[package]
name = "lexer"
edition = "2021"

[dependencies]
colored = "2.1.0"
std-reset = "0.1.5"
macros = { path = "macros" }
lexer3_macros = { path = "lexer3_macros" }
downcast-rs = "1.2.1"
paste = "1.0.15"
regex = "1.11.1"
regex-syntax = "0.8.5"
regex-automata = { version = "0.4.9", features = ["nfa-thompson"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
clap = { version = "4.5.23", features = ["derive"] }
